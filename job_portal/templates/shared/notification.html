{% load humanize %}
<div class="modal fade" id="notificationModal" tabindex="-1" aria-labelledby="notificationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="notificationModalLabel">Notifications</h5>
                <button type="button" class="btn-close-custom" data-bs-dismiss="modal" aria-label="Close"><i class="fa-regular fa-circle-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="d-flex flex-column flex-md-row gap-4 align-items-center justify-content-center">
                    <div class="list-group">
                        {% for job in jobs_notification %}
                        <a href="{% url "user:job-detail" job.id %}" class="list-group-item list-group-item-action d-flex gap-3 py-3" aria-current="true">
                            {% comment %} <img src="https://github.com/twbs.png" alt="twbs" width="32" height="32" class="rounded-circle flex-shrink-0"> {% endcomment %}
                            <div class="d-flex gap-2 w-100 justify-content-between">
                                <div>
                                    <h6 class="mb-0">{{ job.job_title }}</h6>
                                    <p class="mb-0 opacity-75">{{ job.job_description|truncatewords:10 }}</p>
                                </div>
                                <small class="opacity-50 text-nowrap">{{ job.created_at|naturaltime }}</small>
                            </div>
                        </a>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
